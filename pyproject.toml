[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-crumble"
version = "0.1.0a1"
description = "Garment search, design changes, evidence review and SMV suggestions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "numpy>=1.26,<3", "Pillow>=11.3,<13", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "python-multipart>=0.0.22,<1"
]

[project.optional-dependencies]
fashion = ["torch>=2.6,<3", "open_clip_torch>=3.2,<4", "huggingface-hub>=0.30,<2"]
ann = ["faiss-cpu>=1.9,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1.2,<2", "ruff>=0.9,<1"]

[project.scripts]
crumble = "crumble.cli:main"

[tool.setuptools.packages.find]
include = ["crumble*"]

[tool.setuptools.package-data]
crumble = ["static/*.html", "static/*.css", "static/*.js", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
exclude = ["crumble/structure.py", "crumble/normalise.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

