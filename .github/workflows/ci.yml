name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: ruff check crumble tests
      - run: ruff format --check crumble tests
      - run: python scripts/release_check.py
      - run: python -m build
      - run: crumble --workspace /tmp/crumble-smoke demo
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t crumble:test .
      - run: docker run --rm crumble:test crumble --workspace /tmp/work demo
